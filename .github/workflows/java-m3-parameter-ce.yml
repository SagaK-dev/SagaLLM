name: SagaLLM M3 parameter CE matched CPU research
on:
  pull_request:
    paths:
      - 'scripts/train_java_m3_parameter_ce.py'
      - 'tests/test_java_m3_parameter_ce.py'
      - 'examples/java_m3_parameter_holdback.json'
      - '.github/workflows/java-m3-parameter-ce.yml'
permissions:
  contents: read
  actions: read
jobs:
  matched-training:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'experiment/java-m3-parameter-ce-2026-11-24' &&
      github.actor == 'SagaK-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,fast-tokenizer]'
          python -m pytest -q tests/test_java_m3_parameter_ce.py
      - uses: actions/download-artifact@v4
        with:
          name: sagallm-v018-java-context-sft-cpu
          run-id: 44994208434
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v018
      - name: Preflight, train six paired arms, inference only
        run: |
          python -m scripts.train_java_m3_parameter_ce \
            --base v018/java-context-model/java-sft-best.pt \
            --tokenizer v018/java-context-model/tokenizer.json \
            --holdback examples/java_m3_parameter_holdback.json \
            --previous-holdback examples/java_m3_development_holdback.json \
            --curriculum frozen-stdio --output parameter-ce-evidence
          sha256sum parameter-ce-evidence/parameter-ce-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sagallm-m3-parameter-ce-cpu
          path: parameter-ce-evidence/
          if-no-files-found: error
          retention-days: 30
