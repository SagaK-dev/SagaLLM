name: SagaLLM M1 Java conditioning diagnostic (inference only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/java-m1-conditioning.yml'
      - 'scripts/diagnose_java_m1_conditioning.py'
      - 'tests/test_java_m1_conditioning.py'
permissions:
  contents: read
  actions: read
jobs:
  pinned-inference:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'diagnostic/java-m1-conditioning-2026-11-24' &&
       github.actor == 'SagaK-dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[fast-tokenizer,test]'
          python -m pytest -q tests/test_java_m1_conditioning.py
      - uses: actions/download-artifact@v4
        with:
          name: sagallm-v018-java-context-sft-cpu
          run-id: 44994208434
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v018
      - uses: actions/download-artifact@v4
        with:
          name: sagallm-contrastive-stdio-matched-validation-ab
          run-id: 45167198398
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: contrastive
      - name: Inspect frozen models without executing or compiling Java
        run: |
          python -m scripts.diagnose_java_m1_conditioning \
            --base v018/java-context-model/java-sft-best.pt \
            --tokenizer v018/java-context-model/tokenizer.json \
            --candidate contrastive/contrastive-stdio-ab-evidence/contrastive-validation-candidate.pt \
            --prior contrastive/contrastive-stdio-ab-evidence/ab-report.json \
            --output m1-conditioning-report.json
          sha256sum m1-conditioning-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sagallm-m1-conditioning-inference
          path: m1-conditioning-report.json
          if-no-files-found: error
          retention-days: 30
