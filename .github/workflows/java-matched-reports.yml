name: SagaLLM matched Java report comparison (offline fixtures)
on:
  pull_request:
    paths:
      - 'src/sagallm/java_matched_reports.py'
      - 'scripts/compare_java_independent_reports.py'
      - 'tests/test_java_matched_reports.py'
      - 'tests/test_java_staged_execution.py'
      - 'src/sagallm/java_behavior.py'
      - 'src/sagallm/java_independent_benchmark.py'
      - '.github/workflows/java-matched-reports.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10'
      - name: Verify matched and incomplete report semantics
        run: python -m pytest -q tests/test_java_matched_reports.py tests/test_java_staged_execution.py
