name: SagaLLM offline SFT trace verification
on:
  pull_request:
    paths:
      - 'scripts/verify_integrated_sft_trace.py'
      - 'scripts/smoke_integrated_sft_trace.py'
      - 'tests/test_verify_integrated_sft_trace.py'
      - '.github/workflows/offline-sft-trace-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,fast-tokenizer]'
      - run: python -m unittest discover -s tests -p test_verify_integrated_sft_trace.py
      - name: Run integrated smoke and independently verify exact schedule and checkpoint bytes
        run: python -m scripts.smoke_integrated_sft_trace --output offline-sft-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-offline-sft-trace-smoke
          path: offline-sft-smoke/
          if-no-files-found: error
