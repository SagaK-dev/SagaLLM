name: SagaLLM equal cumulative learning-rate sweep
on:
  pull_request:
    paths:
      - 'scripts/run_equal_integral_lr_sweep.py'
      - 'tests/test_equal_integral_lr_sweep.py'
      - '.github/workflows/equal-integral-lr-sweep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sweep:
    if: github.repository == 'SagaK-dev/SagaLLM' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu -c requirements/pilot-46104477318-observed.txt
          python -m pip install -r requirements/pilot-46104477318-observed.txt
          python -m pip install numpy==2.2.6
          python -m pip check
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_equal_integral_lr_sweep.py
      - name: Run six paired 24-step arms at equal cumulative LR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/14738368209/zip > "$tmp/parent.zip"
          unset GH_TOKEN GITHUB_TOKEN
          PYTHONPATH=src python -m scripts.run_equal_integral_lr_sweep --parent-zip "$tmp/parent.zip" --output equal-integral-sweep
          python -m pip freeze --all > equal-integral-sweep/environment-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-equal-integral-lr-sweep-metadata
          path: equal-integral-sweep/
          if-no-files-found: error
