name: SagaLLM preserve traced pilot originals (one-time)
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/archive-traced-pilot-originals.yml'
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'SagaK-dev/SagaLLM' && github.actor == 'SagaK-dev' && github.event.pull_request.user.login == 'SagaK-dev' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'evidence/traced-pilot-originals' && github.event.pull_request.base.ref == 'dev/sft-report-origin-integrity'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Stage exact pinned metadata originals only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15247550137/zip > "$tmp/evidence.zip"
          unset GH_TOKEN
          python -m scripts.archive_traced_pilot_originals --stage-zip "$tmp/evidence.zip"
          python -m scripts.archive_traced_pilot_originals
      - name: Commit only exact new evidence files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git diff --name-only)"
          git add -- experiments/archive/traced-context-pilot-46104477318
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          assert len(paths)==6 and all(p.startswith("experiments/archive/traced-context-pilot-46104477318/") for p in paths)
          assert subprocess.check_output(["git","diff","--cached","--diff-filter=A","--name-only"],text=True).splitlines()==paths
          for p in paths:
              assert subprocess.check_output(["git","show",":"+p])==Path(p).read_bytes()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve exact traced pilot report, trace and metadata originals'
          gh auth setup-git
          git push origin HEAD:refs/heads/evidence/traced-pilot-originals
          git rev-parse HEAD
