name: SagaLLM independent Java I/O protocol (no execution)

on:
  pull_request:
    paths:
      - '.github/workflows/java-independent-io-protocol.yml'
      - 'src/sagallm/java_independent_benchmark.py'
      - 'src/sagallm/java_behavior.py'
      - 'scripts/evaluate_java_independent_io.py'
      - 'examples/java_independent_io_DRAFT.json'
      - 'tests/test_java_independent_benchmark.py'
      - 'docs/JAVA_INDEPENDENT_IO_BENCHMARK.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/java-independent-io-protocol.yml'
      - 'src/sagallm/java_independent_benchmark.py'
      - 'src/sagallm/java_behavior.py'
      - 'scripts/evaluate_java_independent_io.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install protocol test dependencies
        run: python -m pip install 'pytest>=8,<10'
      - name: Test review gates and simulated OCI only
        run: python -m pytest -q tests/test_java_independent_benchmark.py
      - name: Prove unreviewed draft fails closed with no candidates or OCI
        run: |
          python scripts/evaluate_java_independent_io.py \
            --suite examples/java_independent_io_DRAFT.json \
            --candidate-dir /nonexistent \
            --output java-io-draft-probe.json
          python - <<'PY'
          import json
          with open('java-io-draft-probe.json', encoding='utf-8') as fh:
              result = json.load(fh)
          assert result['behavioral_status'] == 'NOT_RUN'
          assert result['reason'] == 'EXPLICIT_OPT_IN_REQUIRED'
          assert result['review_gate'] == 'REVIEW_REQUIRED'
          assert result['java_executed'] is False
          assert result['behavior_passed_tasks'] is None
          PY
      - name: Retain no-execution evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sagallm-java-independent-io-probe-not-run
          path: java-io-draft-probe.json
          retention-days: 30
          if-no-files-found: error
