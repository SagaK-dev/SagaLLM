name: SagaLLM identifier trial input reconstruction
on:
  pull_request:
    paths:
      - 'scripts/audit_identifier_trial_inputs.py'
      - 'scripts/audit_identifier_trial_scope.py'
      - 'tests/test_audit_identifier_trial_scope.py'
      - '.github/workflows/audit-identifier-trial-inputs.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_audit_identifier_trial_scope.py
      - name: Install CPU-only historical reconstruction dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'PyYAML>=6' 'tokenizers>=0.20,<1'
      - name: Rebuild four historical trial input scopes and integrate inventory
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          PYTHONHASHSEED: '0'
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/originals" identifier-trial-reconstructions
          for id in 14750067161 14750350753 14750148284; do
            gh api "repos/SagaK-dev/SagaLLM/actions/artifacts/$id/zip" > "$tmp/originals/$id.zip"
          done
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15240845377/zip > "$tmp/recovery.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15246425930/zip > "$tmp/lineage.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15186012660/zip > "$tmp/inventory.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/14743051466/zip > "$tmp/model.zip"
          unset GH_TOKEN
          echo "b039250f6ebecb4f8631ba38050cf219eb41b53308ea8d0b13bb45f566477789  $tmp/model.zip" | sha256sum -c -
          unzip -p "$tmp/model.zip" java-context-model/tokenizer.json > "$tmp/tokenizer.json"
          rm "$tmp/model.zip"
          for revision in 797ae0d195045ee2c5177ca44c0df474876bd3fc 49c7c55915f03d94a722951ca9b2f7918ba13d3e 4269121a03d06ebdc07629159e7698336d9c4dee f3a5a7e64fb8cb5e01e56291ff22cc34196115c6; do
            git fetch --depth=1 origin "$revision"
            git worktree add --detach "$tmp/$revision" "$revision"
            cp scripts/audit_identifier_trial_inputs.py "$tmp/$revision/scripts/"
            (
              cd "$tmp/$revision"
              PYTHONPATH=src python -m scripts.audit_identifier_trial_inputs --originals "$tmp/originals" --recovery-zip "$tmp/recovery.zip" --tokenizer "$tmp/tokenizer.json" --root "$tmp/$revision-data"
            ) > "$GITHUB_WORKSPACE/identifier-trial-reconstructions/$revision.json"
          done
          python -m scripts.audit_identifier_trial_scope --lineage-zip "$tmp/lineage.zip" --inventory-zip "$tmp/inventory.zip" --reconstructions identifier-trial-reconstructions --inventory-output scoped-identifier-inventory.json > identifier-trial-input-scope.json
          python - <<'PY'
          import json
          d=json.load(open("identifier-trial-input-scope.json"))
          print(json.dumps({k:d[k] for k in ("inventory_entries","new_inventory_entries","new_sources","source_archive_count","trial_report_count","scope")},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: historical-identifier-trial-input-scope-metadata
          path: |
            identifier-trial-reconstructions/*.json
            scoped-identifier-inventory.json
            identifier-trial-input-scope.json
          if-no-files-found: error
