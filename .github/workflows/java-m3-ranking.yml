name: SagaLLM M3 conditional ranking CPU research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/java-m3-ranking.yml'
      - 'scripts/train_java_m3_ranking.py'
      - 'scripts/java_m3_operation_masks.py'
      - 'tests/test_java_m3_ranking.py'
      - 'examples/java_m3_development_holdback.json'
permissions:
  contents: read
  actions: read
jobs:
  matched-cpu-training:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'experiment/java-m3-ranking-2026-11-24' &&
       github.actor == 'SagaK-dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,fast-tokenizer]'
          python -m pytest -q tests/test_java_m3_ranking.py
      - uses: actions/download-artifact@v4
        with:
          name: sagallm-v018-java-context-sft-cpu
          run-id: 44994208434
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v018
      - name: Verify, train six matched CPU arms, run inference only
        run: |
          python -m scripts.train_java_m3_ranking \
            --base v018/java-context-model/java-sft-best.pt \
            --tokenizer v018/java-context-model/tokenizer.json \
            --holdback examples/java_m3_development_holdback.json \
            --curriculum frozen-stdio \
            --output ranking-evidence --mask-mode operation-span-v2
          sha256sum ranking-evidence/ranking-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sagallm-m3-ranking-cpu-research
          path: ranking-evidence/
          if-no-files-found: error
          retention-days: 30
