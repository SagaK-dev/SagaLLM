name: SagaLLM recovered historical report ledger
on:
  pull_request:
    paths:
      - 'scripts/audit_recovered_report_ledger.py'
      - 'tests/test_audit_recovered_report_ledger.py'
      - '.github/workflows/audit-recovered-report-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_audit_recovered_report_ledger.py
      - name: Reverify exact recovered reports and index claims
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15240845377/zip > "$tmp/recovery.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15239309131/zip > "$tmp/triage.zip"
          unset GH_TOKEN
          python -m scripts.audit_recovered_report_ledger --recovery-zip "$tmp/recovery.zip" --recovery-sha256 25a0d7cbacdead46d18c7261287a601bf7a2c114c8ff9a5a6ebf22a0e8ba3040 --triage-zip "$tmp/triage.zip" > recovered-report-ledger.json
          python - <<'PY'
          import json
          d=json.load(open("recovered-report-ledger.json"))
          print(json.dumps({k:d[k] for k in ("preserved_report_instances","distinct_report_sha256_count","duplicate_report_instances","known_checkpoint_declaration_count","unmapped_checkpoint_hash_claims")},sort_keys=True))
          print(json.dumps({"checkpoint_claim_count":len(d["checkpoint_hash_claims"]),"source_hash_count":len(d["source_hash_declarations"])},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: historical-recovered-report-ledger-metadata
          path: recovered-report-ledger.json
          if-no-files-found: error
