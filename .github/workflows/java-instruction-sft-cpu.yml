name: SagaLLM pinned Java instruction SFT (CPU)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/sagallm/java_instruction_sft.py'
      - 'scripts/train_java_instruction.py'
      - 'src/sagallm/java_diverse_corpus.py'
      - '.github/workflows/java-instruction-sft-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: java-instruction-sft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-instruction-sft:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install a Java 17+ compiler for compile-only diagnostics
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install CPU PyTorch and pinned tokenizer dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[fast-tokenizer]'
      - name: Download the exact successful v0.16 real-Java CPU checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: sagallm-v016-pinned-java-cpu
          run-id: 44981937649
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: java-base
      - name: Reconstruct and verify original, family-separated SFT dataset
        run: |
          python - <<'PY'
          from sagallm.java_diverse_corpus import build_java_diverse_corpus,verify_java_diverse_corpus
          print(build_java_diverse_corpus('java-sft-data'))
          print(verify_java_diverse_corpus('java-sft-data'))
          PY
      - name: Supervised fine-tune v0.16 weights and score family-heldout Java
        run: |
          python scripts/train_java_instruction.py \
            --base java-base/java-model/java-best.pt \
            --tokenizer java-base/java-model/tokenizer.json \
            --dataset java-sft-data \
            --output java-sft-model \
            --steps 650 --batch-size 4 --eval-every 100 \
            --max-seconds 420 --compile-cases 8
      - name: Publish model checkpoints, tokenizer and honest report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sagallm-v017-java-instruction-sft-cpu
          path: |
            java-sft-model/java-sft-best.pt
            java-sft-model/java-sft-last.pt
            java-sft-model/tokenizer.json
            java-sft-model/train-report.json
            java-sft-data/manifest.json
          retention-days: 30
          if-no-files-found: error