name: SagaLLM integrated SFT exposure trace
on:
  pull_request:
    paths:
      - 'src/sagallm/java_instruction_sft.py'
      - 'src/sagallm/exposure_trace.py'
      - 'src/sagallm/exposure_source_binding.py'
      - 'scripts/smoke_integrated_sft_trace.py'
      - 'tests/test_exposure_checkpoint_ordering.py'
      - '.github/workflows/integrated-sft-exposure-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,fast-tokenizer]'
      - run: python -m unittest discover -s tests -p 'test_exposure*.py'
      - name: Run actual existing SFT path with opt-in trace
        run: python -m scripts.smoke_integrated_sft_trace --output integrated-sft-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-integrated-sft-trace-smoke
          path: integrated-sft-smoke/
          if-no-files-found: error
