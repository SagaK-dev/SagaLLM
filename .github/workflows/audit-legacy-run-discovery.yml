name: SagaLLM legacy report and hosted run discovery
on:
  pull_request:
    paths:
      - 'scripts/audit_legacy_run_discovery.py'
      - 'tests/test_audit_legacy_run_discovery.py'
      - 'experiments/archive/**'
      - '.github/workflows/audit-legacy-run-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_audit_legacy_run_discovery.py
      - name: Stage pinned legacy originals and discover visible Actions runs
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate --slurp -X GET repos/SagaK-dev/SagaLLM/actions/runs -f per_page=100 -f "created=<$cutoff" > "$tmp/live-pages.json"
          unset GH_TOKEN
          revision=fe31880f6cb9bde71e01b22942964cb6df327186
          git fetch --depth=1 origin "$revision"
          mkdir -p "$tmp/legacy/reports"
          for file in legacy-2026-11-25.json actions-inventory-2026-11-25.json; do
            git show "$revision:experiments/archive/$file" > "$tmp/legacy/$file"
          done
          for file in 45007278383-v018-paired-compile.json 45161749481-public-unreviewed-behavior.json 45164032104-stdio-semantic-sft.json; do
            git show "$revision:experiments/archive/reports/$file" > "$tmp/legacy/reports/$file"
          done
          LEGACY_REPORTS_DIR="$tmp/legacy" python -m unittest discover -s tests -p test_audit_legacy_run_discovery.py
          python -m scripts.audit_legacy_run_discovery --legacy "$tmp/legacy" --live-pages "$tmp/live-pages.json" --cutoff "$cutoff" > legacy-run-discovery.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: historical-legacy-run-discovery-metadata
          path: legacy-run-discovery.json
          if-no-files-found: error
