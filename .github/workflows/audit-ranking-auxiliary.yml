name: SagaLLM historical ranking auxiliary reconstruction
on:
  pull_request:
    paths:
      - 'scripts/audit_ranking_auxiliary.py'
      - 'tests/test_audit_ranking_auxiliary.py'
      - 'experiments/archive/reports/45373241422-m3-ranking-v2.json'
      - '.github/workflows/audit-ranking-auxiliary.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_audit_ranking_auxiliary.py
      - name: Reconstruct historical ranking masks and schedules
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONHASHSEED: '0'
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15178332987/zip > "$tmp/prior.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/14743051466/zip > "$tmp/model.zip"
          unset GH_TOKEN
          echo "b039250f6ebecb4f8631ba38050cf219eb41b53308ea8d0b13bb45f566477789  $tmp/model.zip" | sha256sum -c -
          unzip -p "$tmp/model.zip" java-context-model/tokenizer.json > "$tmp/tokenizer.json"
          rm "$tmp/model.zip"
          git fetch --depth=1 origin babcbe130905d4acc7e4617497f0ebcea68569a9
          git worktree add --detach "$tmp/historical" babcbe130905d4acc7e4617497f0ebcea68569a9
          test "$(git -C "$tmp/historical" rev-parse HEAD)" = babcbe130905d4acc7e4617497f0ebcea68569a9
          cp scripts/audit_ranking_auxiliary.py "$tmp/historical/scripts/"
          cd "$tmp/historical"
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,fast-tokenizer]'
          python -m scripts.audit_ranking_auxiliary --report "$GITHUB_WORKSPACE/experiments/archive/reports/45373241422-m3-ranking-v2.json" --prior-zip "$tmp/prior.zip" --tokenizer "$tmp/tokenizer.json" --historical "$tmp/historical" --curriculum "$tmp/stdio" --derived-output "$tmp/ranking_auxiliary.jsonl" --inventory-output "$GITHUB_WORKSPACE/scoped-ranking-inventory.json" > "$GITHUB_WORKSPACE/ranking-auxiliary-evidence.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: historical-ranking-auxiliary-metadata
          path: |
            scoped-ranking-inventory.json
            ranking-auxiliary-evidence.json
          if-no-files-found: error
