name: SagaLLM preserve schedule sweep and prefix originals (one-time)
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/archive-schedule-sweep-prefix.yml'
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'SagaK-dev/SagaLLM' && github.actor == 'SagaK-dev' && github.event.pull_request.user.login == 'SagaK-dev' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'evidence/schedule-sweep-prefix-originals' && github.event.pull_request.base.ref == 'evidence/reproduction-and-sweep-ledger'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Stage verified metadata originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15254809203/zip > "$tmp/sweep.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15255591135/zip > "$tmp/prefix.zip"
          unset GH_TOKEN
          python -m scripts.archive_schedule_sweep_prefix --sweep "$tmp/sweep.zip" --prefix "$tmp/prefix.zip"
          python -m scripts.archive_schedule_sweep_prefix
      - name: Publish only exact new originals
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git diff --name-only)"
          git add -- experiments/archive/schedule-sweep-46124885819
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from scripts.archive_schedule_sweep_prefix import ROOT,EXPECTED
          paths=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          assert set(paths)=={str(ROOT/n) for n in {"prefix/prefix-comparison.json","archive-manifest.json"}|{"sweep/"+x for x in EXPECTED}}
          assert subprocess.check_output(["git","diff","--cached","--diff-filter=A","--name-only"],text=True).splitlines()==paths
          for p in paths: assert subprocess.check_output(["git","show",":"+p])==Path(p).read_bytes()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve schedule sweep and prefix comparison originals'
          gh auth setup-git
          git push origin HEAD:refs/heads/evidence/schedule-sweep-prefix-originals
