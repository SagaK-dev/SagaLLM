name: SagaLLM verified algorithm curriculum prototype
on:
  pull_request:
    paths:
      - 'src/sagallm/java_algorithm_curriculum.py'
      - 'scripts/verify_algorithm_curriculum.py'
      - 'tests/test_java_algorithm_curriculum.py'
      - '.github/workflows/verified-algorithm-curriculum.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_java_algorithm_curriculum.py
      - name: Compile fixed references and check exact oracle output
        run: PYTHONPATH=src python -m scripts.verify_algorithm_curriculum --output algorithm-curriculum-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-algorithm-curriculum-metadata
          path: algorithm-curriculum-report.json
          if-no-files-found: error
