name: SagaLLM v0.18 paired Java compile diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  paired-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[fast-tokenizer]'
      - name: Download original pinned v0.17 and verified v0.18 artifacts
        uses: actions/download-artifact@v4
        with:
          name: sagallm-v017-java-instruction-sft-cpu
          run-id: 44982940959
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v017
      - uses: actions/download-artifact@v4
        with:
          name: sagallm-v018-java-context-sft-cpu
          run-id: 44994208434
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v018
      - name: Verify original experiment checkpoint identities
        run: |
          echo 'a17268d80ff443e4a0347f3a29df433556506f13537c78ce282836fa8fe4e5f9  v017/java-sft-model/java-sft-best.pt' | sha256sum -c -
          echo '9802e848f0abea9979623f461b5e63cd7aed838acd087d06b20d747db1e2a0fc  v018/java-context-model/java-sft-best.pt' | sha256sum -c -
          echo '186566808cb03e328cac9a6b7b384a8d0aefc54ccb83fbe97782a751726682fe  v017/java-sft-model/tokenizer.json' | sha256sum -c -
      - name: Recreate canonical heldout dataset
        run: |
          python - <<'PY'
          from sagallm.java_diverse_corpus import build_java_diverse_corpus, verify_java_diverse_corpus
          build_java_diverse_corpus('java-dataset')
          verify_java_diverse_corpus('java-dataset')
          PY
      - name: Compile-only paired generation with evidence
        run: |
          python scripts/evaluate_java_context_pair.py \
            --base v017/java-sft-model/java-sft-best.pt \
            --best v018/java-context-model/java-sft-best.pt \
            --tokenizer v017/java-sft-model/tokenizer.json \
            --dataset java-dataset \
            --output paired-java-compile.json --cases 8
      - name: Preserve paired evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sagallm-v018-paired-java-compile-diagnostics
          path: paired-java-compile.json
          retention-days: 30
          if-no-files-found: error
