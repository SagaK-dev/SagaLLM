name: SagaLLM compact algorithm contract boundary audit
on:
  pull_request:
    paths:
      - 'scripts/audit_compact_algorithm_contract_boundaries.py'
      - 'tests/test_audit_compact_algorithm_contract_boundaries.py'
      - 'src/sagallm/java_algorithm_compact_tasks.py'
      - 'src/sagallm/java_algorithm_curriculum.py'
      - 'scripts/audit_algorithm_curriculum_admission.py'
      - 'scripts/verify_algorithm_curriculum.py'
      - '.github/workflows/audit-compact-algorithm-contract-boundaries.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'SagaK-dev/SagaLLM' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu -c requirements/pilot-46104477318-observed.txt
          python -m pip install -r requirements/pilot-46104477318-observed.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_audit_compact_algorithm_contract_boundaries.py
      - name: Verify compact record identity and execute fixed boundary references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15256963954/zip > "$tmp/compact.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15257146273/zip > "$tmp/reference.zip"
          unset GH_TOKEN GITHUB_TOKEN
          PYTHONPATH=src python -m scripts.audit_compact_algorithm_contract_boundaries --compact-zip "$tmp/compact.zip" --reference-zip "$tmp/reference.zip" --output compact-contract-boundaries.json
      - uses: actions/upload-artifact@v4
        with:
          name: compact-algorithm-contract-boundary-metadata
          path: compact-contract-boundaries.json
          if-no-files-found: error
