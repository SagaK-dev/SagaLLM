name: SagaLLM private Java intake (synthetic fixtures only)
on:
  pull_request:
    paths:
      - 'src/sagallm/java_private_intake.py'
      - 'src/sagallm/java_model_freeze.py'
      - 'tests/test_java_model_freeze.py'
      - 'src/sagallm/java_exposure_shards.py'
      - 'scripts/java_exposure_shards.py'
      - 'tests/test_java_exposure_shards.py'
      - 'src/sagallm/java_overlap_screen.py'
      - 'tests/test_java_overlap_screen.py'
      - 'src/sagallm/java_independent_benchmark.py'
      - 'tests/test_java_private_intake.py'
      - 'scripts/audit_java_private_intake.py'
      - '.github/workflows/java-private-intake.yml'
  push:
    branches: [main]
    paths:
      - 'src/sagallm/java_private_intake.py'
      - 'src/sagallm/java_model_freeze.py'
      - 'tests/test_java_model_freeze.py'
      - 'src/sagallm/java_exposure_shards.py'
      - 'scripts/java_exposure_shards.py'
      - 'tests/test_java_exposure_shards.py'
      - 'src/sagallm/java_overlap_screen.py'
      - 'tests/test_java_overlap_screen.py'
      - 'tests/test_java_private_intake.py'
      - 'scripts/audit_java_private_intake.py'
      - '.github/workflows/java-private-intake.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_java_private_intake.py tests/test_java_overlap_screen.py tests/test_java_exposure_shards.py tests/test_java_model_freeze.py
