name: SagaLLM algorithm context balance and loss-mask audit
on:
  pull_request:
    paths:
      - 'scripts/audit_algorithm_context_balance_mask.py'
      - 'tests/test_audit_algorithm_context_balance_mask.py'
      - '.github/workflows/audit-algorithm-context-balance-mask.yml'
      - 'scripts/audit_algorithm_curriculum_admission.py'
      - 'src/sagallm/java_instruction_sft.py'
      - 'src/sagallm/java_algorithm_curriculum.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'SagaK-dev/SagaLLM' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu -c requirements/pilot-46104477318-observed.txt
          python -m pip install -r requirements/pilot-46104477318-observed.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_audit_algorithm_context_balance_mask.py
      - name: Replay pinned admission and verify loss masks and complete groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/14738368209/zip > "$tmp/parent.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15257146273/zip > "$tmp/reference.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15256607793/zip > "$tmp/admission.zip"
          unset GH_TOKEN GITHUB_TOKEN
          PYTHONPATH=src python -m scripts.audit_algorithm_context_balance_mask --parent-zip "$tmp/parent.zip" --reference-zip "$tmp/reference.zip" --admission-zip "$tmp/admission.zip" --output algorithm-context-balance-mask.json
      - uses: actions/upload-artifact@v4
        with:
          name: algorithm-context-balance-mask-metadata
          path: algorithm-context-balance-mask.json
          if-no-files-found: error
