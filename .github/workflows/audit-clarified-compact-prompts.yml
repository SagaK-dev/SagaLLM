name: SagaLLM clarified compact prompt audit
on:
  pull_request:
    paths:
      - 'src/sagallm/java_algorithm_clarified_tasks.py'
      - 'scripts/audit_clarified_compact_prompts.py'
      - 'tests/test_audit_clarified_compact_prompts.py'
      - '.github/workflows/audit-clarified-compact-prompts.yml'
      - 'src/sagallm/java_algorithm_compact_tasks.py'
      - 'src/sagallm/java_algorithm_curriculum.py'
      - 'src/sagallm/java_instruction_sft.py'
      - 'src/sagallm/tokenization.py'
      - 'scripts/audit_compact_algorithm_contract_boundaries.py'
      - 'scripts/verify_compact_algorithm_admission.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'SagaK-dev/SagaLLM' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu -c requirements/pilot-46104477318-observed.txt
          python -m pip install -r requirements/pilot-46104477318-observed.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_audit_clarified_compact_prompts.py
      - name: Replay reference boundary evidence and measure clarified options
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/14738368209/zip > "$tmp/parent.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15257146273/zip > "$tmp/reference.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15256963954/zip > "$tmp/compact.zip"
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/15258415001/zip > "$tmp/boundary.zip"
          unset GH_TOKEN GITHUB_TOKEN
          PYTHONPATH=src python -m scripts.audit_clarified_compact_prompts --parent-zip "$tmp/parent.zip" --reference-zip "$tmp/reference.zip" --compact-zip "$tmp/compact.zip" --boundary-zip "$tmp/boundary.zip" --output clarified-compact-prompts.json
          echo 'd2ec7ea34b7f245d7bca7ba8782cd33ba6d0f7dd8dabb8bcb37b43448b38c253  clarified-compact-prompts.json' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: clarified-compact-prompt-metadata
          path: clarified-compact-prompts.json
          if-no-files-found: error
