name: SagaLLM exact SFT prompt collision review
on:
  pull_request:
    paths:
      - 'scripts/audit_sft_prompt_collisions.py'
      - 'tests/test_audit_sft_prompt_collisions.py'
      - '.github/workflows/audit-sft-prompt-collisions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu -c requirements/pilot-46104477318-observed.txt
          python -m pip install -r requirements/pilot-46104477318-observed.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_audit_sft_prompt_collisions.py
      - name: Reconstruct exact canonical corpus and audit prompt collisions
        run: PYTHONPATH=src python -m scripts.audit_sft_prompt_collisions --output prompt-collision-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-sft-prompt-collision-review-metadata
          path: prompt-collision-review.json
          if-no-files-found: error
