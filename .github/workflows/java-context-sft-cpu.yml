name: SagaLLM pinned Java longer-context SFT (CPU)

on:
  pull_request:
    paths:
      - 'src/sagallm/java_instruction_sft.py'
      - 'scripts/train_java_instruction.py'
      - 'tests/test_java_context_extension.py'
      - '.github/workflows/java-context-sft-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: java-context-sft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-context-sft:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install JDK for compile-only model diagnostics
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install CPU torch and the matching fast tokenizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[fast-tokenizer]'
      - name: Retrieve pinned v0.17 SFT checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: sagallm-v017-java-instruction-sft-cpu
          run-id: 44982940959
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: java-context-base
      - name: Generate and verify family-isolated synthetic Java data
        run: |
          python - <<'PY'
          from sagallm.java_diverse_corpus import build_java_diverse_corpus, verify_java_diverse_corpus
          print(build_java_diverse_corpus('java-context-data'))
          print(verify_java_diverse_corpus('java-context-data'))
          PY
      - name: Train extended 384-token context with pinned 192-token weights
        run: |
          python scripts/train_java_instruction.py \
            --base java-context-base/java-sft-model/java-sft-best.pt \
            --tokenizer java-context-base/java-sft-model/tokenizer.json \
            --dataset java-context-data \
            --output java-context-model \
            --context 384 \
            --steps 400 --batch-size 4 --eval-every 50 \
            --lr 0.00004 --max-seconds 420 --compile-cases 8
      - name: Preserve selected and last weights, tokenizer and complete evaluation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sagallm-v018-java-context-sft-cpu
          path: |
            java-context-model/java-sft-best.pt
            java-context-model/java-sft-last.pt
            java-context-model/tokenizer.json
            java-context-model/train-report.json
            java-context-data/manifest.json
          retention-days: 30
          if-no-files-found: error