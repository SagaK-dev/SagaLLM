name: SagaLLM prospective optimizer exposure trace
on:
  pull_request:
    paths:
      - 'src/sagallm/exposure_trace.py'
      - 'scripts/smoke_optimizer_exposure_trace.py'
      - 'tests/test_exposure_trace.py'
      - '.github/workflows/optimizer-exposure-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CPU torch and package
        run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[fast-tokenizer]'
      - run: python -m unittest discover -s tests -p test_exposure_trace.py
      - name: Run actual tiny synthetic CPU optimizer trace smoke
        run: python -m scripts.smoke_optimizer_exposure_trace --output exposure-trace-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-optimizer-exposure-trace-smoke
          path: |
            exposure-trace-smoke/optimizer-exposure.jsonl
            exposure-trace-smoke/trace-smoke-report.json
          if-no-files-found: error
