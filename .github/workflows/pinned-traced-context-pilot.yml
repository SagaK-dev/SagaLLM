name: SagaLLM prospective pinned context trace pilot
on:
  pull_request:
    paths:
      - 'scripts/run_pinned_traced_context_pilot.py'
      - '.github/workflows/pinned-traced-context-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    if: github.repository == 'SagaK-dev/SagaLLM' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,fast-tokenizer]'
      - name: Run offline verification unit tests
        run: python -m unittest discover -s tests -p test_verify_integrated_sft_trace.py
      - name: Train bounded new pilot on exact historical parent and verify local evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh api repos/SagaK-dev/SagaLLM/actions/artifacts/14738368209/zip > "$tmp/parent.zip"
          unset GH_TOKEN GITHUB_TOKEN
          python -m scripts.run_pinned_traced_context_pilot --parent-zip "$tmp/parent.zip" --output traced-context-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-pinned-context-trace-pilot-evidence
          path: |
            traced-context-pilot/train-report.json
            traced-context-pilot/optimizer-exposure.jsonl
            traced-context-pilot/offline-audit.json
            traced-context-pilot/dataset-manifest.json
            traced-context-pilot/pilot-summary.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-pinned-context-trace-pilot-unpromoted-checkpoints
          path: |
            traced-context-pilot/java-sft-best.pt
            traced-context-pilot/java-sft-last.pt
            traced-context-pilot/tokenizer.json
          if-no-files-found: error
          retention-days: 30
