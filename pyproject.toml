[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagallm"
version = "0.12.0"
description = "Local-first from-scratch decoder-only language model research framework"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "httpx2>=2.0; python_version >= '3.11'"]
parquet = ["pyarrow>=14"]
monitor = ["psutil>=5"]
serve = ["fastapi>=0.110", "uvicorn>=0.30"]
fast-tokenizer = ["tokenizers>=0.20,<1.0"]
hf-export = ["safetensors>=0.4", "transformers>=4.46,<5.0", "tokenizers>=0.20,<1.0"]

[project.scripts]
sagallm = "sagallm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"sagallm.hf_export" = ["*.py"]